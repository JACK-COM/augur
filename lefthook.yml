# Copies of panoply-lib files are generated: a hand edit to one fails here.
pre-commit:
  commands:
    panoply-lib:
      run: ../panoply-lib/sync.sh --check augur
    selftest:
      run: python3 -m unittest discover -s tests -t . && python3 src/augur/augur.py selftest
    typecheck:
      run: UV_OFFLINE=1 uvx --quiet --from mypy==2.4.1 mypy || uvx --quiet --from mypy==2.4.1 mypy
